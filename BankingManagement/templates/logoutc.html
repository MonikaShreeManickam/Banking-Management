<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | Secure Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="form-box">
        <div class="logo">
            <h1>💜 <span>Secure</span> Bank</h1>
        </div>
        <center>
            <i class="fas fa-sign-out-alt"
               style="font-size:70px;color:#bb86fc;"></i>
            <br><br>
            <h2>Logout Confirmation</h2>
            <p style="color:#cccccc;font-size:16px;">
                Are you sure you want to logout?
            </p>
            <br><br>
            <a href="{{ url_for('customer.login') }}"
   class="btn"
   style="display:inline-block;
          width:180px;
          text-decoration:none;
          margin-right:15px;">
    <i class="fas fa-check-circle"></i>
    Yes, Logout
</a>

<a href="{{ url_for('customer.dashboard') }}"
   class="btn"
   style="display:inline-block;
          width:180px;
          text-decoration:none;
          background:linear-gradient(45deg,#444,#666);">
    <i class="fas fa-arrow-left"></i>
    Cancel
</a>
        </center>
        <div class="line"></div>
        <div class="small-text">
            Thank you for banking with Secure Bank.
            <br><br>
            © 2026 Secure Bank | Customer Module
        </div>
    </div>
</div>
</body>
</html>
