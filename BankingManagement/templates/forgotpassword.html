<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Secure Bank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<div class="forgot-password-page">

    <div class="forgot-password-card">

        <div class="forgot-password-icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h2>Forgot Password?</h2>

        <p class="forgot-password-text">
            Enter your registered details to verify your account.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('customer.forgotpassword') }}">

            <div class="forgot-form-group">

                <label for="customer_id">
                    Customer ID
                </label>

                <div class="forgot-input-box">

                    <i class="fa-solid fa-id-card"></i>

                    <input type="number"
                           id="customer_id"
                           name="customer_id"
                           placeholder="Enter Customer ID"
                           required>

                </div>

            </div>


            <div class="forgot-form-group">

                <label for="email">
                    Registered Email
                </label>

                <div class="forgot-input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter registered email"
                           required>

                </div>

            </div>


            <div class="forgot-form-group">

                <label for="mobile">
                    Registered Mobile
                </label>

                <div class="forgot-input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input type="text"
                           id="mobile"
                           name="mobile"
                           placeholder="Enter registered mobile"
                           maxlength="10"
                           required>

                </div>

            </div>


            <button type="submit"
                    class="forgot-verify-btn">

                <i class="fa-solid fa-circle-check"></i>
                Verify

            </button>

        </form>


        <div class="forgot-back-login">

            <a href="{{ url_for('customer.login') }}">

                <i class="fa-solid fa-arrow-left"></i>
                Back to Login

            </a>

        </div>

    </div>

</div>

</body>
</html>
