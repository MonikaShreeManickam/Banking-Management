<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Secure Bank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="form-box login-box">

        <!-- Logo -->

        <div class="logo">

            <h1>

                <i class="fas fa-university"></i>

                <span>Secure</span> Bank

            </h1>

        </div>

        <h2>

            <i class="fas fa-user-shield"></i>

            Administrator Login

        </h2>

        <!-- Flash Messages -->

        {% with messages = get_flashed_messages() %}
        {% if messages %}

        <div class="error-message">

            {{ messages[0] }}

        </div>

        {% endif %}
        {% endwith %}

        <!-- Login Form -->

        <form action="{{ url_for('admin.adminlogin') }}" method="POST">

            <div class="input-group">

                <label>

                    <i class="fas fa-user-shield"></i>

                    UserName

                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter UserName"
                    required>

            </div>

            <div class="input-group">

                <label>

                    <i class="fas fa-lock"></i>

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

            </div>

            <div class="extra">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="{{ url_for('admin.adminchangepassword') }}">

                    Forgot Password?

                </a>

            </div>

            <button class="btn" type="submit">

                <i class="fas fa-right-to-bracket"></i>

                Login

            </button>

        </form>

        <div class="line"></div>

        <div class="links">

            <p>

                Customer Login?

                <a href="{{ url_for('customer.login') }}">

                    Click Here

                </a>

            </p>

        </div>

        <br>

        <div class="small-text">

            <i class="fas fa-shield-halved"></i>

            Authorized Administrators Only

            <br><br>

            © 2026 Secure Bank

        </div>

    </div>

</div>

</body>

</html>
