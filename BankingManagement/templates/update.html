<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Profile | Secure Bank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="logo">

            <h2>💜 Secure Bank</h2>

        </div>

        <ul>

            <li>

                <a href="{{ url_for('customer.dashboard') }}">

                    <i class="fas fa-home"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="{{ url_for('customer.profile') }}">

                    <i class="fas fa-user"></i>

                    My Profile

                </a>

            </li>

            <li>

                <a href="{{ url_for('customer.update') }}" class="active">

                    <i class="fas fa-user-edit"></i>

                    Update Profile

                </a>

            </li>

            <li>

                <a href="{{ url_for('customer.logout') }}">

                    <i class="fas fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- ================= Main Content ================= -->
<div class="main-content">

    <h1 class="page-title">
        Update Customer Profile
    </h1>

    <div class="profile-card">

        <form action="{{ url_for('customer.update') }}" method="POST">

    <div class="form-control">

        <label>Full Name</label>

        <input type="text"
               name="fullname"
               value="{{ customer.full_name }}">

    </div>

    <div class="form-control">

        <label>Email Address</label>

        <input type="email"
               name="email"
               value="{{ customer.email }}">

    </div>

    <div class="form-control">

        <label>Mobile Number</label>

        <input type="text"
               name="mobile"
               value="{{ customer.mobile }}">

    </div>

    <div class="form-control">

        <label>Address</label>

        <textarea
        name="address">{{ customer.address }}</textarea>

    </div>

    <div class="form-control">

        <label>Account Type</label>

        <select name="accounttype">

            <option>Savings</option>

            <option>Current</option>

        </select>

    </div>

    <div class="form-control">

        <label>Date of Birth</label>

        <input type="date"
               name="dob"
               value="{{ customer.date_of_birth }}">

    </div>

    <div class="form-control">

        <label>Gender</label>

        <select name="gender">

            <option>Male</option>

            <option>Female</option>

        </select>

    </div>

    <div class="form-control">

        <label>Username</label>

        <input type="text"
               name="username"
               value="{{ customer.username }}">

    </div>

    <div class="form-control">

        <label>New Password</label>

        <input type="password"
               name="password">

    </div>

    <div class="form-control">

        <label>Confirm Password</label>

        <input type="password"
               name="confirm">

    </div>

    <br>

    <div class="button-group">

        <button class="save-btn">

            Save Changes

        </button>

    </div>

</form>

    </div>

</div>
<div class="footer">
    © 2026 Secure Bank | Banking Management System
</div>
</main>
</div>
</body>
</html>
