<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration | Secure Bank</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="form-box register-box">

        <!-- Logo -->

        <div class="logo">

            <h1>💜 <span>Secure</span> Bank</h1>

        </div>

        <h2>Create Customer Account</h2>

        <!-- Flash Messages -->

        {% with messages = get_flashed_messages() %}
            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}
        {% endwith %}

        <!-- Registration Form -->

        <form action="{{ url_for('customer.register') }}" method="POST">

            <div class="input-group">

                <label>Customer Name (As per Aadhaar)</label>

                <input
                    type="text"
                    name="fullname"
                    placeholder="Enter Name as per Aadhaar"
                    required>

            </div>

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email Address"
                    required>

            </div>

            <div class="input-group">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    name="mobile"
                    placeholder="Enter Mobile Number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required>

            </div>

            <div class="input-group">

                <label>Address</label>

                <input
                    type="text"
                    name="address"
                    placeholder="Enter Address"
                    required>

            </div>

            <div class="input-group">

                <label>Aadhaar Number</label>

                <input
                    type="text"
                    name="aadhaar"
                    placeholder="Enter Aadhaar Number"
                    maxlength="12"
                    pattern="[0-9]{12}"
                    required>

            </div>

            <div class="input-group">

                <label>Account Type</label>

                <select name="accounttype" required>

                    <option value="">-- Select Account Type --</option>

                    <option value="Savings">Savings</option>

                    <option value="Current">Current</option>

                </select>

            </div>

            <div class="input-group">

                <label>Date of Birth</label>

                <input
                    type="date"
                    name="dob"
                    required>

            </div>

            <div class="input-group">

                <label>Gender</label>

                <select name="gender" required>

                    <option value="">Select Gender</option>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                    <option value="Other">Other</option>

                </select>

            </div>

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    autocomplete="username"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create Password"
                    autocomplete="new-password"
                    required>

            </div>

            <small id="password-error"
                   style="color:red;"></small>

            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirmpassword"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required>

            </div>

            <div class="extra">

                <label>

                    <input
                        type="checkbox"
                        required>

                    I Agree to Terms & Conditions

                </label>

            </div>

            <button
                class="btn"
                type="submit">

                Register Account

            </button>

        </form>

        <div class="line"></div>

        <div class="links">

            <p>

                Already have an account?

                <a href="{{ url_for('customer.login') }}">

                    Login Here

                </a>

            </p>

        </div>

        <br>

        <div class="small-text">

            © 2026 Secure Bank. All Rights Reserved.

        </div>

    </div>

</div>

<!-- Password Validation -->

<script src="{{ url_for('static', filename='js/validation.js') }}"></script>

</body>

</html>
